<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" width="720" height="275" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>I2C bus: an Arduino Mega master, an LCD backpack at address 0x27 and a slave Mega at address 0x08 all hang on the same two wires, SDA and SCL, pulled up to 5V</title><rect width="720" height="275" fill="#fff"/><text x="14" y="30" text-anchor="start" font-size="13" fill="#24292f" font-weight="600">5V</text><line x1="34" y1="26" x2="100" y2="26" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="26" x2="50" y2="34" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><rect x="44" y="34" width="12" height="22" rx="2" fill="#fff" stroke="#24292f" stroke-width="2"/><line x1="50" y1="56" x2="50" y2="70" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><circle cx="50" cy="70" r="3.5" fill="#24292f"/><line x1="85" y1="26" x2="85" y2="34" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><rect x="79" y="34" width="12" height="22" rx="2" fill="#fff" stroke="#24292f" stroke-width="2"/><line x1="85" y1="56" x2="85" y2="100" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><circle cx="85" cy="100" r="3.5" fill="#24292f"/><text x="100" y="50" text-anchor="start" font-size="12" fill="#8c959f" font-weight="400">pull-ups (on the boards)</text><line x1="40" y1="70" x2="600" y2="70" stroke="#00878F" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="100" x2="600" y2="100" stroke="#24292f" stroke-width="3" stroke-linecap="round"/><text x="610" y="75" text-anchor="start" font-size="13" fill="#00878F" font-weight="600">SDA (data)</text><text x="610" y="105" text-anchor="start" font-size="13" fill="#24292f" font-weight="600">SCL (clock)</text><line x1="130" y1="70" x2="130" y2="150" stroke="#00878F" stroke-width="2" stroke-linecap="round"/><circle cx="130" cy="70" r="3.5" fill="#00878F"/><line x1="170" y1="100" x2="170" y2="150" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><circle cx="170" cy="100" r="3.5" fill="#24292f"/><rect x="75" y="150" width="150" height="80" rx="6" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="150" y="176" text-anchor="middle" font-size="14" fill="#24292f" font-weight="600">Master</text><text x="150" y="196" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">Mega, pins 20 / 21</text><text x="150" y="217" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no address</text><line x1="310" y1="70" x2="310" y2="150" stroke="#00878F" stroke-width="2" stroke-linecap="round"/><circle cx="310" cy="70" r="3.5" fill="#00878F"/><line x1="350" y1="100" x2="350" y2="150" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><circle cx="350" cy="100" r="3.5" fill="#24292f"/><rect x="255" y="150" width="150" height="80" rx="6" fill="#fff" stroke="#00878F" stroke-width="2"/><text x="330" y="176" text-anchor="middle" font-size="14" fill="#24292f" font-weight="600">LCD backpack</text><text x="330" y="196" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">PCF8574</text><text x="330" y="217" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">address 0x27</text><line x1="490" y1="70" x2="490" y2="150" stroke="#00878F" stroke-width="2" stroke-linecap="round"/><circle cx="490" cy="70" r="3.5" fill="#00878F"/><line x1="530" y1="100" x2="530" y2="150" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><circle cx="530" cy="100" r="3.5" fill="#24292f"/><rect x="435" y="150" width="150" height="80" rx="6" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="510" y="176" text-anchor="middle" font-size="14" fill="#24292f" font-weight="600">Slave</text><text x="510" y="196" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">Mega, pins 20 / 21</text><text x="510" y="217" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">address 0x08</text><text x="345" y="258" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">Every device on the bus also shares GND. The master picks who answers by address.</text></svg>