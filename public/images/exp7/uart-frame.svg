<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 256" width="734" height="256" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>UART frame for the character A at 8N1: the idle line is high, a low start bit, eight data bits least significant first, then a high stop bit</title><rect width="734" height="256" fill="#fff"/><line x1="102" y1="50" x2="102" y2="140" stroke="#8c959f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="76.0" y="42" text-anchor="middle" font-size="13" fill="#8c959f" font-weight="400">idle</text><line x1="154" y1="50" x2="154" y2="140" stroke="#8c959f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="128.0" y="42" text-anchor="middle" font-size="13" fill="#24292f" font-weight="600">start</text><text x="128.0" y="160" text-anchor="middle" font-size="14" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><line x1="206" y1="50" x2="206" y2="140" stroke="#8c959f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="180.0" y="42" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400">D0</text><text x="180.0" y="160" text-anchor="middle" font-size="14" fill="#00878F" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><line x1="258" y1="50" x2="258" y2="140" stroke="#8c959f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="232.0" y="42" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400">D1</text><text x="232.0" y="160" text-anchor="middle" font-size="14" fill="#00878F" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><line x1="310" y1="50" x2="310" y2="140" stroke="#8c959f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="284.0" y="42" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400">D2</text><text x="284.0" y="160" t