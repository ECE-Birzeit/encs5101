mily="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><line x1="622" y1="50" x2="622" y2="140" stroke="#8c959f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="596.0" y="42" text-anchor="middle" font-size="13" fill="#24292f" font-weight="600">stop</text><text x="596.0" y="160" text-anchor="middle" font-size="14" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="648.0" y="42" text-anchor="middle" font-size="13" fill="#8c959f" font-weight="400">idle</text><polyline points="50,70 102,70 102,120 154,120 154,70 206,70 206,120 258,120 258,120 310,120 310,120 362,120 362,120 414,120 414,120 466,120 466,70 518,70 518,120 570,120 570,70 622,70 622,70 674,70" fill="none" stroke="#00878F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="75" text-anchor="end" font-size="11" fill="#8c959f" font-weight="400">HIGH</text><text x="44" y="125" text-anchor="end" font-size="11" fill="#8c959f" font-weight="400">LOW</text><line x1="156" y1="175" x2="568" y2="175" stroke="#00878F" stroke-width="2" stroke-linecap="round"/><line x1="156" y1="170" x2="156" y2="175" stroke="#00878F" stroke-width="2" stroke-linecap="round"/><line x1="568" y1="170" x2="568" y2="175" stroke="#00878F" stroke-width="2" stroke-linecap="round"/><text x="362.0" y="195" text-anchor="middle" font-size="13" fill="#00878F" font-weight="400">8 data bits, least significant first: 0b01000001 = 0x41 = 'A'</text><line x1="105" y1="208" x2="151" y2="208" stroke="#24292f" stroke-width="1.5" stroke-linecap="round"/><line x1="105" y1="203" x2="105" y2="213" stroke="#24292f" stroke-width="1.5" stroke-linecap="round"/><line x1="151" y1="203" x2="151" y2="213" stroke="#24292f" stroke-width="1.5" stroke-linecap="round"/><text x="128.0" y="228" text-anchor="middle" font-size="12" fill="#24292f" font-weight="400">one bit = 1 / baud</text><text x="128.0" y="244" text-anchor="middle" font-size="12" fill="#8c959f" 