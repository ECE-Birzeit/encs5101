<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 160" width="652" height="160" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>An I2C read: the master sends START, the 7-bit address 0x08 and the read bit; the slave acknowledges and sends two data bytes, the master acknowledging the first and not the second, then STOP</title><rect width="652" height="160" fill="#fff"/><rect x="20" y="40" width="34" height="44" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="37.0" y="67" text-anchor="middle" font-size="14" fill="#00878F" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">S</text><text x="37.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">START</text><rect x="58" y="40" width="110" height="44" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="113.0" y="67" text-anchor="middle" font-size="14" fill="#00878F" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0001000</text><text x="113.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">address 0x08</text><rect x="172" y="40" width="62" height="44" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="203.0" y="67" text-anchor="middle" font-size="14" fill="#00878F" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="203.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">R/W: read</text><rect x="238" y="40" width="40" height="44" rx="3" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/><text x="258.0" y="67" text-anchor="middle" font-size="14" fill="#24292f" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A</text><text x="258.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">ACK</text><rect x="282" y="40" width="110" height="44" rx="3" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/><text x="337.0" y="67" text-anchor="middle" font-size="14" fill="#24292f" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">high byte</text><text x="337.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">data</text><rect x="396" y="40" width="40" height="44" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="416.0" y="67" text-anchor="middle" font-size="14" fill="#00878F" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A</text><text x="416.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">ACK</text><rect x="440" y="40" width="110" height="44" rx="3" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/><text x="495.0" y="67" text-anchor="middle" font-size="14" fill="#24292f" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">low byte</text><text x="495.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">data</text><rect x="554" y="40" width="40" height="44" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="574.0" y="67" text-anchor="middle" font-size="14" fill="#00878F" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">N</text><text x="574.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">NACK</text><rect x="598" y="40" width="34" height="44" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="615.0" y="67" text-anchor="middle" font-size="14" fill="#00878F" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">P</text><text x="615.0" y="104" text-anchor="middle" font-size="11" fill="#8c959f" font-weight="400">STOP</text><rect x="20" y="128" width="16" height="16" rx="3" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="44" y="141" text-anchor="start" font-size="12" fill="#24292f" font-weight="400">sent by the master</text><rect x="200" y="128" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/><text x="224" y="141" text-anchor="start" font-size="12" fill="#24292f" font-weight="400">sent by the slave</text><text x="20" y="26" text-anchor="start" font-size="13" fill="#24292f" font-weight="600">Wire.requestFrom(8, 2): the master reads two bytes from address 0x08</text></svg>