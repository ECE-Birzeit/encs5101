<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 235" width="580" height="235" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Two Arduino Megas linked by Serial1: TX1 pin 18 of each board goes to RX1 pin 19 of the other, and the grounds are joined. Each board keeps its USB port for uploading and the Serial Monitor.</title><rect width="580" height="235" fill="#fff"/><rect x="20" y="30" width="170" height="170" rx="6" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="105" y="58" text-anchor="middle" font-size="15" fill="#24292f" font-weight="600">Board A</text><text x="105" y="76" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">Arduino Mega</text><rect x="390" y="30" width="170" height="170" rx="6" fill="#e6f4f4" stroke="#00878F" stroke-width="2"/><text x="475" y="58" text-anchor="middle" font-size="15" fill="#24292f" font-weight="600">Board B</text><text x="475" y="76" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">Arduino Mega</text><text x="178" y="115" text-anchor="end" font-size="13" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TX1  18</text><text x="402" y="115" text-anchor="start" font-size="13" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TX1  18</text><circle cx="190" cy="110" r="4" fill="#00878F"/><circle cx="390" cy="110" r="4" fill="#00878F"/><text x="178" y="150" text-anchor="end" font-size="13" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RX1  19</text><text x="402" y="150" text-anchor="start" font-size="13" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RX1  19</text><circle cx="190" cy="145" r="4" fill="#00878F"/><circle cx="390" cy="145" r="4" fill="#00878F"/><text x="178" y="185" text-anchor="end" font-size="13" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GND</text><text x="402" y="185" text-anchor="start" font-size="13" fill="#24292f" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GND</text><circle cx="190" cy="180" r="4" fill="#00878F"/><circle cx="390" cy="180" r="4" fill="#00878F"/><polyline points="190,110 250,110 330,145 390,145" fill="none" stroke="#00878F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="190,145 250,145 330,110 390,110" fill="none" stroke="#24292f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="190" y1="180" x2="390" y2="180" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><text x="290" y="100" text-anchor="middle" font-size="12" fill="#00878F" font-weight="400">A talks, B listens</text><text x="290" y="165" text-anchor="middle" font-size="12" fill="#24292f" font-weight="400">B talks, A listens</text><text x="290" y="198" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">common ground</text><text x="105" y="222" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">USB: upload + Serial Monitor</text><text x="475" y="222" text-anchor="middle" font-size="12" fill="#8c959f" font-weight="400">USB: upload + Serial Monitor</text></svg>